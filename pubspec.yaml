name: aarogya
description: Privacy-preserving personal health and disaster companion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  crypto: ^3.0.6
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  flutter_map: ^8.2.1
  flutter_riverpod: ^3.2.1
  geolocator: ^14.0.1
  go_router: ^17.1.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.6.0+eol
  supabase_flutter: ^2.10.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.12.2
  drift_dev: ^2.32.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/models/
    - assets/geo/
    - assets/brand/
